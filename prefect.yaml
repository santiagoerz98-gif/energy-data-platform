# Generic metadata about this project
name: energy-data-platform
prefect-version: 3.8.3

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: C:\Users\Admin\Desktop\proyectos\energy-data-platform

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
  - name: demanda-peninsular
    tags: [energy, demand]
    description: Procesa los datos de demanda peninsular y los almacena en la base de datos.
    schedule: {}
    flow_name: energy-pipeline-flow
    entrypoint: pipeline/flows/energy_pipeline_flow.py:energy_pipeline_flow
    parameters:
      {
        indicators_ids: [1293, 544, 545],
        start_date: null,
        end_date: null,
        time_trunc: null,
      }
    work_pool:
      name: energy-local
      work_queue_name: default
