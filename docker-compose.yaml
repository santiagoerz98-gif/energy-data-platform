version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: energy_dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: energy_user
      POSTGRES_PASSWORD: energy_password
      POSTGRES_DB: energy_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_user -d energy_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3.2-python3.11
    container_name: energy_prefect_server
    restart: unless-stopped
    entrypoint:
      ["bash", "-c", "prefect server start --host 0.0.0.0 --port 4200"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://energy_user:energy_password@postgres:5432/energy_dw
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_LOGGING_LEVEL: INFO
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - energy-network

  prefect-worker:
    image: prefecthq/prefect:3-python3.11
    container_name: energy_prefect_worker
    restart: unless-stopped
    entrypoint:
      [
        "bash",
        "-c",
        "pip install -r /workspace/requirements.txt && prefect worker start --pool default-agent-pool --type process",
      ]
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql+psycopg://energy_user:energy_password@postgres:5432/energy_dw
      ESIOS_API_KEY: ${ESIOS_API_KEY}
    depends_on:
      - prefect-server
      - postgres
    volumes:
      - .:/workspace
    working_dir: /workspace
    networks:
      - energy-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: energy_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://energy_user:energy_password@postgres:5432/energy_dw
      ESIOS_API_KEY: ${ESIOS_API_KEY}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - energy-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: energy_streamlit
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - energy-network

volumes:
  postgres_data:
  prefect_data:

networks:
  energy-network:
    driver: bridge
